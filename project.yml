name: IDOTaskMaster
options:
  bundleIdPrefix: com.idotaskmaster
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0
targets:
  IDOTaskMaster:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: IDOTaskMaster
        excludes:
          - "MCPServer/**"
    settings:
      base:
        PRODUCT_NAME: IDOTaskMaster
        PRODUCT_BUNDLE_IDENTIFIER: com.idotaskmaster.mac
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
  IDOTaskMasterMCP:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: IDOTaskMaster/Core
      - path: IDOTaskMaster/Providers
      - path: IDOTaskMaster/MCPServer
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: IDOTaskMasterMCP
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  IDOTaskMaster:
    build:
      targets:
        IDOTaskMaster: all
    run:
      config: Debug
    archive:
      config: Release
  IDOTaskMasterMCP:
    build:
      targets:
        IDOTaskMasterMCP: all
    run:
      config: Debug
    archive:
      config: Release
